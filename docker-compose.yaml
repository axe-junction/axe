version: '3.8'

services:
  data-api:
    build:
      context: ./packages/data-service/fastapi
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://example_user:example_password@db:5432/example_db
    depends_on:
      - db
    networks:
      - axe_network

  db:
    image: postgis/postgis:latest
    environment:
      POSTGRES_USER: example_user
      POSTGRES_PASSWORD: example_password
      POSTGRES_DB: example_db
    ports:
      - "5436:5432"
    volumes:
      - ./volumes/db:/var/lib/postgresql/data
    networks:
      - axe_network

  rabitmq:
    image: rabbitmq:management
    ports:
      - "15672:15672"  
      - "5672:5672"    
    networks:
      - axe_network
  
  zookeeper:
    image: zookeeper:3.7
    ports:
      - "2181:2181"
    networks:
      - axe_network
  kafka:
    image: confluentinc/cp-kafka:7.2.1
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    networks:
      - axe_network
  routing-service:
    build:
      context: ./packages/routing-service
      dockerfile: Dockerfile
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=example_user
      - DB_PASSWORD=example_password
      - DB_NAME=example_db
      - GIN_MODE=release
    ports:
      - "3001:3001"
    depends_on:
      - db
    networks:
      - axe_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.routing.rule=PathPrefix(`/routing`)"
      - "traefik.http.services.routing.loadbalancer.server.port=3001"
  vtc-service:
    build:
      context: ./packages/vtc-service
      dockerfile: Dockerfile
    environment:
      - DB_HOST=db
      - DB_PORT=5439
      - DB_USER=example_user
      - DB_PASSWORD=example_password
      - DB_NAME=example_db
      - ROUTING_SERVICE_URL=http://routing-service:3001
      - GIN_MODE=release
    ports:
      - "8080:8080"
    depends_on:
      - routing-service
      - db
    networks:
      - axe_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vtc.rule=PathPrefix(`/vtc`)"
      - "traefik.http.services.vtc.loadbalancer.server.port=8080"
  traefik:
    image: traefik:v2.10
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--providers.docker.exposedbydefault=false"
    ports:
      - "80:80"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - axe_network
      

networks:
  axe_network:
    driver: bridge