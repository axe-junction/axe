syntax = "proto3";

package vtc;

option go_package = "github.com/axe-junction/axe-server/gateway/pkg/pb";

message PriceRequest {
  string origin_name = 1;
  string destination_name = 2;
  double origin_lat = 3;
  double origin_lng = 4;
  double destination_lat = 5;
  double destination_lng = 6;
}

message PriceResponse {
  EstimateResponse estimate = 1;
  string error = 2;
}

message EstimateResponse {
  PriceEstimate yassir = 1;
  RangeEstimate heetch = 2;
  PriceEstimate indrive = 3;
  PriceEstimate yango = 4;
}

message PriceEstimate {
  int32 price = 1;
  string eta = 2;
}

message RangeEstimate {
  string price_range = 1;
  string eta = 2;
}

service VTCService {
  rpc GetVTCPrices(PriceRequest) returns (PriceResponse);
}
